# Generado por api/ con "npm run build && npm run contrato". No se edita a mano.
openapi: 3.0.0
paths:
  /salud:
    get:
      operationId: SaludController_obtener
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSalud"
      summary: Indica si la API está viva. No consulta la base de datos.
      tags:
        - salud
  /acceso/codigos:
    post:
      operationId: AccesoController_pedirCodigo
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedirCodigo"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodigoEnviado"
        "400":
          description: El celular no es de Colombia o está mal escrito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Bloqueado, muy seguido o demasiados códigos. Trae Retry-After.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "503":
          description: El canal de envío no aceptó el mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Envía un código de 6 dígitos al celular. Responde igual para números
        nuevos y registrados.
      tags:
        - acceso
  /acceso/sesiones:
    post:
      operationId: AccesoController_entrar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entrar"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionAbierta"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "401":
          description: Código incorrecto (con intentos restantes), vencido o ya usado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Celular bloqueado 15 minutos tras 5 fallos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Verifica el código y abre una sesión. La primera vez registra a la
        persona.
      tags:
        - acceso
  /acceso/yo:
    get:
      operationId: AccesoController_yo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAutenticado"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Quién es la persona de la sesión.
      tags:
        - acceso
  /acceso/sesiones/actual:
    delete:
      operationId: AccesoController_salir
      parameters: []
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Cierra la sesión de este dispositivo.
      tags:
        - acceso
  /empresas:
    get:
      operationId: MisEmpresasController_listar
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaMiEmpresa"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Empresas de la persona de la sesión, por razón social, con rol, modo,
        permisos e invitaciones pendientes.
      tags:
        - empresas
    post:
      operationId: MisEmpresasController_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaEmpresa"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMiEmpresa"
        "400":
          description: Razón social vacía o de más de 450 caracteres.
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: La persona ya lleva el máximo de empresas (empresa.limite).
      security:
        - bearer: []
      summary: Crea una empresa; quien la crea queda como dueño.
      tags:
        - empresas
  /empresas/{id}:
    get:
      operationId: EmpresasController_obtener
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
        "400":
          description: Falta X-Empresa (empresa.sin-elegir).
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: "No existe, es de otra empresa o la persona no es miembro activo:
            la API no distingue."
      security:
        - bearer: []
      summary: Datos de la empresa. Solo responde por la empresa elegida en X-Empresa.
      tags:
        - empresas
  /empresas/{empresaId}/invitacion/aceptar:
    post:
      operationId: InvitacionesController_aceptar
      parameters:
        - name: empresaId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: No hay invitación pendiente para esta persona en esa empresa
            (invitacion.no-encontrada).
      security:
        - bearer: []
      summary: "Acepta la invitación: desde ya puede trabajar en la empresa con el rol
        que le dieron."
      tags:
        - empresas
  /empresas/{empresaId}/invitacion/rechazar:
    post:
      operationId: InvitacionesController_rechazar
      parameters:
        - name: empresaId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: No hay invitación pendiente para esta persona en esa empresa
            (invitacion.no-encontrada).
      security:
        - bearer: []
      summary: "Rechaza la invitación: la empresa deja de aparecer en su lista."
      tags:
        - empresas
  /miembros:
    get:
      operationId: MiembrosController_listar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
      security:
        - bearer: []
      summary: Personas invitadas y activas de la empresa.
      tags:
        - miembros
    post:
      operationId: MiembrosController_invitar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoMiembro"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "409":
          description: Ya está o ya tiene invitación (miembro.ya-esta), o la empresa llegó
            al tope (miembro.limite).
        "429":
          description: Tope de invitaciones del día (miembro.limite-diario).
      security:
        - bearer: []
      summary: Invita a una persona por su celular; entra cuando acepta la invitación.
      tags:
        - miembros
  /miembros/{usuarioId}:
    patch:
      operationId: MiembrosController_cambiar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: usuarioId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioDeMiembro"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaCambioDeMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "404":
          description: La persona no está en la empresa (miembro.no-encontrado).
        "409":
          description: Es su propio rol (miembro.sobre-si-mismo) o dejaría la empresa sin
            dueño (miembro.ultimo-dueno).
      security:
        - bearer: []
      summary: Cambia el rol o el modo de una persona. Nadie cambia su propio rol.
      tags:
        - miembros
    delete:
      operationId: MiembrosController_retirar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: usuarioId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: "Retirada: deja de ver la empresa desde la siguiente petición."
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "404":
          description: La persona no está en la empresa (miembro.no-encontrado).
        "409":
          description: Es el último dueño (miembro.ultimo-dueno).
      security:
        - bearer: []
      summary: Retira a una persona (o a uno mismo) sin borrar su historia. Nunca al
        último dueño.
      tags:
        - miembros
info:
  title: CONTA API
  description: "API única de CONTA: facturación electrónica DIAN, contabilidad y
    multiempresa."
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    RespuestaSalud:
      type: object
      properties:
        estado:
          type: string
          enum:
            - ok
        servicio:
          type: string
          enum:
            - conta-api
        version:
          type: string
          example: 0.1.0
        hora:
          type: string
          format: date-time
      required:
        - estado
        - servicio
        - version
        - hora
    PedirCodigo:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
          description: Celular de Colombia. Acepta espacios y +57.
      required:
        - celular
    CodigoEnviado:
      type: object
      properties:
        venceEn:
          type: string
          format: date-time
          description: El código vence a los 10 minutos.
        otroCodigoDesde:
          type: string
          format: date-time
          description: Desde cuándo se puede pedir otro código.
      required:
        - venceEn
        - otroCodigoDesde
    RechazoDeAcceso:
      type: object
      properties:
        codigo:
          type: string
          example: acceso.codigo-incorrecto
        mensaje:
          type: string
          example: El código no coincide. Revísalo e intenta de nuevo.
        reintentarDesde:
          type: string
          format: date-time
        intentosRestantes:
          type: number
          example: 3
      required:
        - codigo
        - mensaje
    Entrar:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
        codigo:
          type: string
          example: "482913"
          pattern: ^\d{6}$
      required:
        - celular
        - codigo
    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: string
          format: uuid
        celular:
          type: string
          example: "+573001234567"
      required:
        - id
        - celular
    SesionAbierta:
      type: object
      properties:
        token:
          type: string
          description: "Va en Authorization: Bearer <token>. Guárdalo en el almacén seguro
            del dispositivo."
        venceEn:
          type: string
          format: date-time
        usuario:
          $ref: "#/components/schemas/UsuarioAutenticado"
        nuevo:
          type: boolean
          description: true si este acceso registró a la persona.
      required:
        - token
        - venceEn
        - usuario
        - nuevo
    RespuestaMiEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
        rol:
          type: string
          enum: &a1
            - dueno
            - contador
            - cajero
        modo:
          type: string
          enum: &a2
            - simple
            - contador
          description: Cara con que la app muestra la empresa. No da permisos.
        estado:
          type: string
          enum:
            - invitada
            - activa
          description: "invitada: hay que aceptarla antes de entrar."
        permisos:
          type: array
          description: Lo que el rol deja hacer; sirve para mostrar u ocultar acciones.
          items:
            type: string
            enum:
              - ver-empresa
              - vender
              - ver-informes
              - anular-documentos
              - gestionar-miembros
              - usar-modo-contador
      required:
        - id
        - razonSocial
        - rol
        - modo
        - estado
        - permisos
    NuevaEmpresa:
      type: object
      properties:
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
          maxLength: 450
      required:
        - razonSocial
    RespuestaEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
      required:
        - id
        - razonSocial
    RespuestaMiembro:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
          description: Id de la persona; es el que llevan las rutas /miembros/:usuarioId.
        celular:
          type: string
          example: +57 300 *** 4567
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
        estado:
          type: string
          enum:
            - invitada
            - activa
      required:
        - usuarioId
        - celular
        - rol
        - modo
        - estado
    NuevoMiembro:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
          description: Celular de Colombia de quien se invita.
        rol:
          type: string
          enum: *a1
          example: cajero
        modo:
          type: string
          enum: *a2
          description: "Si no viene: contador para el rol contador, simple para los demás."
      required:
        - celular
        - rol
    CambioDeMiembro:
      type: object
      properties:
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
    RespuestaCambioDeMiembro:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
      required:
        - usuarioId
        - rol
        - modo
