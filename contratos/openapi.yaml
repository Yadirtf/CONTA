# Generado por api/ con "npm run build && npm run contrato". No se edita a mano.
openapi: 3.0.0
paths:
  /salud:
    get:
      operationId: SaludController_obtener
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSalud"
      summary: Indica si la API está viva. No consulta la base de datos.
      tags:
        - salud
  /acceso/codigos:
    post:
      operationId: AccesoController_pedirCodigo
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedirCodigo"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodigoEnviado"
        "400":
          description: El celular no es de Colombia o está mal escrito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Bloqueado, muy seguido o demasiados códigos. Trae Retry-After.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "503":
          description: El canal de envío no aceptó el mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Envía un código de 6 dígitos al celular. Responde igual para números
        nuevos y registrados.
      tags:
        - acceso
  /acceso/sesiones:
    post:
      operationId: AccesoController_entrar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entrar"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionAbierta"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "401":
          description: Código incorrecto (con intentos restantes), vencido o ya usado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Celular bloqueado 15 minutos tras 5 fallos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Verifica el código y abre una sesión. La primera vez registra a la
        persona.
      tags:
        - acceso
  /acceso/yo:
    get:
      operationId: AccesoController_yo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAutenticado"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Quién es la persona de la sesión.
      tags:
        - acceso
  /acceso/sesiones/actual:
    delete:
      operationId: AccesoController_salir
      parameters: []
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Cierra la sesión de este dispositivo.
      tags:
        - acceso
  /empresas:
    get:
      operationId: MisEmpresasController_listar
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaEmpresa"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Empresas a las que pertenece la persona de la sesión, por razón social.
      tags:
        - empresas
    post:
      operationId: MisEmpresasController_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaEmpresa"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
        "400":
          description: Razón social vacía o de más de 450 caracteres.
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: La persona ya lleva el máximo de empresas (empresa.limite).
      security:
        - bearer: []
      summary: Crea una empresa; quien la crea queda como miembro.
      tags:
        - empresas
  /empresas/{id}:
    get:
      operationId: EmpresasController_obtener
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
        "400":
          description: Falta X-Empresa (empresa.sin-elegir).
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: "No existe, es de otra empresa o la persona no es miembro: la API
            no distingue."
      security:
        - bearer: []
      summary: Datos de la empresa. Solo responde por la empresa elegida en X-Empresa.
      tags:
        - empresas
info:
  title: CONTA API
  description: "API única de CONTA: facturación electrónica DIAN, contabilidad y
    multiempresa."
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    RespuestaSalud:
      type: object
      properties:
        estado:
          type: string
          enum:
            - ok
        servicio:
          type: string
          enum:
            - conta-api
        version:
          type: string
          example: 0.1.0
        hora:
          type: string
          format: date-time
      required:
        - estado
        - servicio
        - version
        - hora
    PedirCodigo:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
          description: Celular de Colombia. Acepta espacios y +57.
      required:
        - celular
    CodigoEnviado:
      type: object
      properties:
        venceEn:
          type: string
          format: date-time
          description: El código vence a los 10 minutos.
        otroCodigoDesde:
          type: string
          format: date-time
          description: Desde cuándo se puede pedir otro código.
      required:
        - venceEn
        - otroCodigoDesde
    RechazoDeAcceso:
      type: object
      properties:
        codigo:
          type: string
          example: acceso.codigo-incorrecto
        mensaje:
          type: string
          example: El código no coincide. Revísalo e intenta de nuevo.
        reintentarDesde:
          type: string
          format: date-time
        intentosRestantes:
          type: number
          example: 3
      required:
        - codigo
        - mensaje
    Entrar:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
        codigo:
          type: string
          example: "482913"
          pattern: ^\d{6}$
      required:
        - celular
        - codigo
    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: string
          format: uuid
        celular:
          type: string
          example: "+573001234567"
      required:
        - id
        - celular
    SesionAbierta:
      type: object
      properties:
        token:
          type: string
          description: "Va en Authorization: Bearer <token>. Guárdalo en el almacén seguro
            del dispositivo."
        venceEn:
          type: string
          format: date-time
        usuario:
          $ref: "#/components/schemas/UsuarioAutenticado"
        nuevo:
          type: boolean
          description: true si este acceso registró a la persona.
      required:
        - token
        - venceEn
        - usuario
        - nuevo
    RespuestaEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
      required:
        - id
        - razonSocial
    NuevaEmpresa:
      type: object
      properties:
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
          maxLength: 450
      required:
        - razonSocial
