# Generado por api/ con "npm run build && npm run contrato". No se edita a mano.
openapi: 3.0.0
paths:
  /salud:
    get:
      operationId: SaludController_obtener
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSalud"
      summary: Indica si la API está viva. No consulta la base de datos.
      tags:
        - salud
  /acceso/codigos:
    post:
      operationId: AccesoController_pedirCodigo
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedirCodigo"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodigoEnviado"
        "400":
          description: El celular no es de Colombia o está mal escrito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Bloqueado, muy seguido o demasiados códigos. Trae Retry-After.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "503":
          description: El canal de envío no aceptó el mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Envía un código de 6 dígitos al celular. Responde igual para números
        nuevos y registrados.
      tags:
        - acceso
  /acceso/sesiones:
    post:
      operationId: AccesoController_entrar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entrar"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionAbierta"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "401":
          description: Código incorrecto (con intentos restantes), vencido o ya usado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Celular bloqueado 15 minutos tras 5 fallos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      summary: Verifica el código y abre una sesión. La primera vez registra a la
        persona.
      tags:
        - acceso
  /acceso/yo:
    get:
      operationId: AccesoController_yo
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioAutenticado"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Quién es la persona de la sesión.
      tags:
        - acceso
  /acceso/sesiones/actual:
    delete:
      operationId: AccesoController_salir
      parameters: []
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Cierra la sesión de este dispositivo.
      tags:
        - acceso
  /acceso/segundo-factor:
    get:
      operationId: SegundoFactorController_estado
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoDelSegundoFactor"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Dice si la persona ya configuró su app y si esta sesión está verificada.
      tags:
        - acceso
  /acceso/segundo-factor/inscripcion:
    post:
      operationId: SegundoFactorController_inscribir
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InscripcionIniciada"
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: Ya tiene app y no verificó en los últimos 10 minutos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "503":
          description: Falta la clave de cifrado en el servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      security:
        - bearer: []
      summary: Crea la clave de la app autenticadora. Cambiar una app existente exige
        haber verificado hace poco.
      tags:
        - acceso
  /acceso/segundo-factor/inscripcion/confirmacion:
    post:
      operationId: SegundoFactorController_confirmar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodigoDelSegundoFactor"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InscripcionConfirmada"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: No hay una configuración pendiente o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "422":
          description: Código incorrecto, con intentos restantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Bloqueado 15 minutos tras 5 fallos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      security:
        - bearer: []
      summary: Confirma la app con su primer código, verifica esta sesión y entrega
        los códigos de recuperación.
      tags:
        - acceso
  /acceso/segundo-factor/verificacion:
    post:
      operationId: SegundoFactorController_verificarCodigo
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodigoDelSegundoFactor"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegundoFactorVerificado"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: La persona todavía no configuró su app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "422":
          description: Código incorrecto o ya usado, con intentos restantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
        "429":
          description: Bloqueado 15 minutos tras 5 fallos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazoDeAcceso"
      security:
        - bearer: []
      summary: Verifica esta sesión por una jornada con un código de la app o uno de
        recuperación.
      tags:
        - acceso
  /empresas:
    get:
      operationId: MisEmpresasController_listar
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaMiEmpresa"
        "401":
          description: Sin sesión, vencida o cerrada.
      security:
        - bearer: []
      summary: Empresas de la persona de la sesión, por razón social, con rol, modo,
        permisos e invitaciones pendientes.
      tags:
        - empresas
    post:
      operationId: MisEmpresasController_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaEmpresa"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMiEmpresa"
        "400":
          description: Razón social vacía o de más de 450 caracteres.
        "401":
          description: Sin sesión, vencida o cerrada.
        "409":
          description: La persona ya lleva el máximo de empresas (empresa.limite).
      security:
        - bearer: []
      summary: Crea una empresa; quien la crea queda como dueño.
      tags:
        - empresas
  /empresas/{id}:
    get:
      operationId: EmpresasController_obtener
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
        "400":
          description: Falta X-Empresa (empresa.sin-elegir).
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: "No existe, es de otra empresa o la persona no es miembro activo:
            la API no distingue."
      security:
        - bearer: []
      summary: Datos de la empresa. Solo responde por la empresa elegida en X-Empresa.
      tags:
        - empresas
  /empresas/{empresaId}/invitacion/aceptar:
    post:
      operationId: InvitacionesController_aceptar
      parameters:
        - name: empresaId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: No hay invitación pendiente para esta persona en esa empresa
            (invitacion.no-encontrada).
      security:
        - bearer: []
      summary: "Acepta la invitación: desde ya puede trabajar en la empresa con el rol
        que le dieron."
      tags:
        - empresas
  /empresas/{empresaId}/invitacion/rechazar:
    post:
      operationId: InvitacionesController_rechazar
      parameters:
        - name: empresaId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
        "401":
          description: Sin sesión, vencida o cerrada.
        "404":
          description: No hay invitación pendiente para esta persona en esa empresa
            (invitacion.no-encontrada).
      security:
        - bearer: []
      summary: "Rechaza la invitación: la empresa deja de aparecer en su lista."
      tags:
        - empresas
  /miembros:
    get:
      operationId: MiembrosController_listar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
      security:
        - bearer: []
      summary: Personas invitadas y activas de la empresa.
      tags:
        - miembros
    post:
      operationId: MiembrosController_invitar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoMiembro"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "409":
          description: Ya está o ya tiene invitación (miembro.ya-esta), o la empresa llegó
            al tope (miembro.limite).
        "429":
          description: Tope de invitaciones del día (miembro.limite-diario).
      security:
        - bearer: []
      summary: Invita a una persona por su celular; entra cuando acepta la invitación.
      tags:
        - miembros
  /miembros/{usuarioId}:
    patch:
      operationId: MiembrosController_cambiar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: usuarioId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioDeMiembro"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaCambioDeMiembro"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "404":
          description: La persona no está en la empresa (miembro.no-encontrado).
        "409":
          description: Es su propio rol (miembro.sobre-si-mismo) o dejaría la empresa sin
            dueño (miembro.ultimo-dueno).
      security:
        - bearer: []
      summary: Cambia el rol o el modo de una persona. Nadie cambia su propio rol.
      tags:
        - miembros
    delete:
      operationId: MiembrosController_retirar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: usuarioId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: "Retirada: deja de ver la empresa desde la siguiente petición."
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "404":
          description: La persona no está en la empresa (miembro.no-encontrado).
        "409":
          description: Es el último dueño (miembro.ultimo-dueno).
      security:
        - bearer: []
      summary: Retira a una persona (o a uno mismo) sin borrar su historia. Nunca al
        último dueño.
      tags:
        - miembros
  /clientes/busqueda:
    post:
      operationId: ClientesController_buscar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Busqueda"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaBusqueda"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "429":
          description: Demasiadas búsquedas seguidas (cliente.limite-de-busquedas).
      security:
        - bearer: []
      summary: Busca compradores por el comienzo de su documento y calcula el dígito
        de verificación si es un NIT.
      tags:
        - clientes
  /clientes/consumidor-final:
    get:
      operationId: ClientesController_consumidorFinal
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaCliente"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
      security:
        - bearer: []
      summary: El comprador «consumidor final» de la DIAN, para quien no pide factura
        a su nombre.
      tags:
        - clientes
  /clientes:
    post:
      operationId: ClientesController_crear
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoCliente"
      responses:
        "200":
          description: "Ya existía: con el mismo id (reintento), el comprador completo;
            con otro id, solo lo de CompradorEncontrado, y cuenta como
            búsqueda."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaCliente"
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaCliente"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "409":
          description: El id ya es de otro comprador (cliente.id-en-uso).
        "429":
          description: Tope de compradores nuevos del día (cliente.limite-diario).
      security:
        - bearer: []
      summary: Crea un comprador. Si su documento ya existe, devuelve el guardado
        (200) sin cambiarlo.
      tags:
        - clientes
  /productos:
    get:
      operationId: ProductosController_listar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: buscar
          required: false
          in: query
          description: "Vacío: los primeros 50 por nombre."
          schema: {}
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaListaDeProductos"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
      security:
        - bearer: []
      summary: Lista productos por parte del nombre (sin importar tildes) o el
        comienzo del código.
      tags:
        - productos
    post:
      operationId: ProductosController_crear
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoProducto"
      responses:
        "200":
          description: "Ya existía con ese id: el guardado, sin cambios."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaProducto"
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaProducto"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "409":
          description: El código ya es de otro producto (producto.codigo-en-uso).
        "429":
          description: Tope de productos nuevos del día de la empresa
            (producto.limite-diario) o de la persona
            (producto.limite-por-persona).
      security:
        - bearer: []
      summary: Crea un producto con su precio e IVA. Repetir el mismo id devuelve el
        guardado (200).
      tags:
        - productos
  /ventas:
    get:
      operationId: VentasController_listar
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaVentaReciente"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
      security:
        - bearer: []
      summary: "«Mis ventas»: las 50 más recientes con su estado ante la DIAN, para
        volver a compartir una."
      tags:
        - ventas
    post:
      operationId: VentasController_crear
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaVenta"
      responses:
        "200":
          description: "Ya existía con ese id y ese pedido: la guardada, sin cambios."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaVenta"
        "201":
          description: Guardada con su número; la factura va a la DIAN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaVenta"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "409":
          description: El id es de otra venta (venta.id-en-uso), el negocio no está
            habilitado (facturacion.no-habilitada) o no hay números
            (facturacion.sin-numeracion).
        "422":
          description: Un producto o el comprador no son del negocio.
        "429":
          description: Tope de ventas del día de la empresa o de la persona.
      security:
        - bearer: []
      summary: Registra una venta y emite su factura. Repetir el mismo id con lo mismo
        devuelve la guardada (200).
      tags:
        - ventas
  /ventas/{id}:
    get:
      operationId: VentasController_obtener
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaVenta"
        "403":
          description: "El rol no tiene el permiso (permiso.denegado: «No tienes permiso»)."
        "404":
          description: No es una venta de este negocio (venta.no-encontrada).
      security:
        - bearer: []
      summary: Una venta con su estado ante la DIAN, en palabras del modo simple.
      tags:
        - ventas
  /ventas/{id}/comprobante:
    get:
      operationId: ComprobanteController_obtener
      parameters:
        - name: X-Empresa
          in: header
          description: Id de la empresa en la que se trabaja.
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: El PDF (application/pdf).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: El rol no tiene el permiso (permiso.denegado).
        "404":
          description: No es una venta de este negocio (venta.no-encontrada).
        "409":
          description: Todavía va para la DIAN (comprobante.en-camino) o la rechazó
            (comprobante.rechazado).
        "429":
          description: Muchos comprobantes seguidos (comprobante.limite).
      security:
        - bearer: []
      summary: El PDF de la factura con su QR, cuando la DIAN ya la aceptó.
      tags:
        - ventas
info:
  title: CONTA API
  description: "API única de CONTA: facturación electrónica DIAN, contabilidad y
    multiempresa."
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    RespuestaSalud:
      type: object
      properties:
        estado:
          type: string
          enum:
            - ok
        servicio:
          type: string
          enum:
            - conta-api
        version:
          type: string
          example: 0.1.0
        hora:
          type: string
          format: date-time
      required:
        - estado
        - servicio
        - version
        - hora
    PedirCodigo:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
          description: Celular de Colombia. Acepta espacios y +57.
      required:
        - celular
    CodigoEnviado:
      type: object
      properties:
        venceEn:
          type: string
          format: date-time
          description: El código vence a los 10 minutos.
        otroCodigoDesde:
          type: string
          format: date-time
          description: Desde cuándo se puede pedir otro código.
      required:
        - venceEn
        - otroCodigoDesde
    RechazoDeAcceso:
      type: object
      properties:
        codigo:
          type: string
          example: acceso.codigo-incorrecto
        mensaje:
          type: string
          example: El código no coincide. Revísalo e intenta de nuevo.
        reintentarDesde:
          type: string
          format: date-time
        intentosRestantes:
          type: number
          example: 3
      required:
        - codigo
        - mensaje
    Entrar:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
        codigo:
          type: string
          example: "482913"
          pattern: ^\d{6}$
      required:
        - celular
        - codigo
    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: string
          format: uuid
        celular:
          type: string
          example: "+573001234567"
      required:
        - id
        - celular
    SesionAbierta:
      type: object
      properties:
        token:
          type: string
          description: "Va en Authorization: Bearer <token>. Guárdalo en el almacén seguro
            del dispositivo."
        venceEn:
          type: string
          format: date-time
        usuario:
          $ref: "#/components/schemas/UsuarioAutenticado"
        nuevo:
          type: boolean
          description: true si este acceso registró a la persona.
      required:
        - token
        - venceEn
        - usuario
        - nuevo
    EstadoDelSegundoFactor:
      type: object
      properties:
        inscrito:
          type: boolean
          description: true si la persona ya configuró su app autenticadora.
        verificadaHasta:
          type: string
          format: date-time
          nullable: true
          description: Hasta cuándo vale la verificación de esta sesión.
        codigosDeRecuperacionRestantes:
          type: number
          example: 10
      required:
        - inscrito
        - verificadaHasta
        - codigosDeRecuperacionRestantes
    InscripcionIniciada:
      type: object
      properties:
        secreto:
          type: string
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
          description: Clave en base32. Se muestra una sola vez.
        uri:
          type: string
          example: otpauth://totp/CONTA:...
          description: La misma clave como enlace, para el QR.
        venceEn:
          type: string
          format: date-time
          description: Hasta cuándo se puede confirmar con el primer código.
      required:
        - secreto
        - uri
        - venceEn
    CodigoDelSegundoFactor:
      type: object
      properties:
        codigo:
          type: string
          example: "482913"
          description: Los 6 números de la app autenticadora o, si se perdió, un código de
            recuperación (ABCDE-FGHJK).
      required:
        - codigo
    InscripcionConfirmada:
      type: object
      properties:
        codigosDeRecuperacion:
          description: Se muestran una sola vez. Cada uno sirve para entrar si se pierde
            la app.
          type: array
          items:
            type: string
        verificadaHasta:
          type: string
          format: date-time
      required:
        - codigosDeRecuperacion
        - verificadaHasta
    SegundoFactorVerificado:
      type: object
      properties:
        via:
          type: string
          enum:
            - app
            - recuperacion
        verificadaHasta:
          type: string
          format: date-time
        codigosDeRecuperacionRestantes:
          type: number
          example: 10
      required:
        - via
        - verificadaHasta
        - codigosDeRecuperacionRestantes
    RespuestaMiEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
        rol:
          type: string
          enum: &a1
            - dueno
            - contador
            - cajero
        modo:
          type: string
          enum: &a2
            - simple
            - contador
          description: Cara con que la app muestra la empresa. No da permisos.
        estado:
          type: string
          enum:
            - invitada
            - activa
          description: "invitada: hay que aceptarla antes de entrar."
        permisos:
          type: array
          description: Lo que el rol deja hacer; sirve para mostrar u ocultar acciones.
          items:
            type: string
            enum:
              - ver-empresa
              - vender
              - gestionar-productos
              - ver-informes
              - anular-documentos
              - gestionar-miembros
              - usar-modo-contador
        exigeSegundoFactor:
          type: boolean
          description: true si para entrar hay que pasar el segundo factor (contador o
            modo contador, HU-04.04).
      required:
        - id
        - razonSocial
        - rol
        - modo
        - estado
        - permisos
        - exigeSegundoFactor
    NuevaEmpresa:
      type: object
      properties:
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
          maxLength: 450
      required:
        - razonSocial
    RespuestaEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
          example: Tienda Doña Rosa S.A.S.
      required:
        - id
        - razonSocial
    RespuestaMiembro:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
          description: Id de la persona; es el que llevan las rutas /miembros/:usuarioId.
        celular:
          type: string
          example: +57 300 *** 4567
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
        estado:
          type: string
          enum:
            - invitada
            - activa
      required:
        - usuarioId
        - celular
        - rol
        - modo
        - estado
    NuevoMiembro:
      type: object
      properties:
        celular:
          type: string
          example: 300 123 4567
          description: Celular de Colombia de quien se invita.
        rol:
          type: string
          enum: *a1
          example: cajero
        modo:
          type: string
          enum: *a2
          description: "Si no viene: contador para el rol contador, simple para los demás."
      required:
        - celular
        - rol
    CambioDeMiembro:
      type: object
      properties:
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
    RespuestaCambioDeMiembro:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
        rol:
          type: string
          enum: *a1
        modo:
          type: string
          enum: *a2
      required:
        - usuarioId
        - rol
        - modo
    Busqueda:
      type: object
      properties:
        documento:
          type: string
          example: "900373"
          description: "El comienzo del documento: 3 letras o números como mínimo."
      required:
        - documento
    NitCalculado:
      type: object
      properties:
        numero:
          type: string
          example: "900373076"
        digitoVerificacion:
          type: number
          example: 4
      required:
        - numero
        - digitoVerificacion
    CompradorEncontrado:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipoDocumento:
          type: string
          enum:
            - "11"
            - "12"
            - "13"
            - "21"
            - "22"
            - "31"
            - "41"
            - "42"
            - "50"
            - "91"
        numero:
          type: string
          example: "900373076"
        digitoVerificacion:
          type: object
          nullable: true
          example: 4
        nombre:
          type: string
        tipoDePersona:
          type: string
          enum: &a3
            - natural
            - juridica
      required:
        - id
        - tipoDocumento
        - numero
        - digitoVerificacion
        - nombre
        - tipoDePersona
    RespuestaBusqueda:
      type: object
      properties:
        nit:
          nullable: true
          description: "Si lo escrito es un NIT posible: su dígito de verificación."
          type: object
          allOf:
            - $ref: "#/components/schemas/NitCalculado"
        clientes:
          description: Hasta 10, ordenados por número.
          type: array
          items:
            $ref: "#/components/schemas/CompradorEncontrado"
      required:
        - nit
        - clientes
    DireccionDeCliente:
      type: object
      properties:
        codigoMunicipio:
          type: string
          example: "11001"
          description: Código DANE del municipio (5 dígitos).
        ciudad:
          type: string
          example: Bogotá D.C.
        departamento:
          type: string
          example: Bogotá
        linea:
          type: string
          example: "Calle 12 # 3-45"
      required:
        - codigoMunicipio
        - ciudad
        - departamento
        - linea
    RespuestaCliente:
      type: object
      properties:
        id:
          type: object
          format: uuid
          nullable: true
          description: null en el consumidor final, que no se guarda.
        esConsumidorFinal:
          type: boolean
          description: true solo en el consumidor final (222222222222).
        tipoDocumento:
          type: string
          enum:
            - "11"
            - "12"
            - "13"
            - "21"
            - "22"
            - "31"
            - "41"
            - "42"
            - "50"
            - "91"
        numero:
          type: string
          example: "900373076"
        digitoVerificacion:
          type: object
          nullable: true
          example: 4
          description: Solo con NIT; siempre calculado.
        nombre:
          type: string
        tipoDePersona:
          type: string
          enum: *a3
        responsabilidadesFiscales:
          example:
            - R-99-PN
          type: array
          items:
            type: string
        responsableDeIva:
          type: boolean
        correo:
          type: object
          nullable: true
        direccion:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/DireccionDeCliente"
      required:
        - id
        - esConsumidorFinal
        - tipoDocumento
        - numero
        - digitoVerificacion
        - nombre
        - tipoDePersona
        - responsabilidadesFiscales
        - responsableDeIva
        - correo
    NuevoCliente:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Lo elige la app: repetir la petición con el mismo id no crea dos."
        tipoDocumento:
          type: string
          enum:
            - "11"
            - "12"
            - "13"
            - "21"
            - "22"
            - "31"
            - "41"
            - "42"
            - "50"
            - "91"
          example: "13"
          description: 13 cédula, 31 NIT, 22 cédula de extranjería…
        numero:
          type: string
          example: "900373076"
          description: Se aceptan puntos y espacios. Con NIT, «900373076-4» también sirve.
        digitoVerificacion:
          type: number
          minimum: 0
          maximum: 9
          description: Si se escribe, debe coincidir con el calculado.
        nombre:
          type: string
          example: Ferretería El Tornillo S.A.S.
          description: Nombre de la persona o razón social.
        tipoDePersona:
          type: string
          enum: *a3
        responsabilidadesFiscales:
          example:
            - O-13
          description: "Del RUT (casilla 53). Si no viene: R-99-PN."
          type: array
          items:
            type: string
        responsableDeIva:
          type: boolean
          description: "Responsable de IVA. Si no viene: no."
        correo:
          type: object
          nullable: true
          example: compras@eltornillo.co
          description: Para mandarle la factura.
        direccion:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/DireccionDeCliente"
      required:
        - id
        - tipoDocumento
        - numero
        - nombre
        - tipoDePersona
    IvaDelProducto:
      type: object
      properties:
        tipo:
          type: string
          enum: &a4
            - gravado
            - exento
            - excluido
        tarifa:
          type: object
          nullable: true
          example: "19"
          description: 19 o 5 si es gravado; 0 si es exento; null si es excluido.
      required:
        - tipo
        - tarifa
    PrecioDeUnaUnidad:
      type: object
      properties:
        total:
          type: string
          example: "2500.00"
          description: Precio de venta con IVA incluido.
        base:
          type: string
          example: "2100.84"
        iva:
          type: string
          example: "399.16"
      required:
        - total
        - base
        - iva
    RespuestaProducto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Gaseosa 400 ml
        codigo:
          type: object
          nullable: true
        unidad:
          type: string
          enum:
            - "94"
            - KGM
            - GRM
            - LBR
            - LTR
            - MLT
            - MTR
            - HUR
        iva:
          $ref: "#/components/schemas/IvaDelProducto"
        precio:
          $ref: "#/components/schemas/PrecioDeUnaUnidad"
      required:
        - id
        - nombre
        - codigo
        - unidad
        - iva
        - precio
    RespuestaListaDeProductos:
      type: object
      properties:
        productos:
          description: Hasta 50, ordenados por nombre.
          type: array
          items:
            $ref: "#/components/schemas/RespuestaProducto"
      required:
        - productos
    NuevoProducto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Lo elige la app: repetir la petición con el mismo id no crea dos."
        nombre:
          type: string
          example: Gaseosa 400 ml
          description: Como va en la factura (1 a 300 caracteres).
        codigo:
          type: object
          nullable: true
          example: "7702004003508"
          description: Código interno o de barras, único en la empresa.
        unidad:
          type: string
          enum:
            - "94"
            - KGM
            - GRM
            - LBR
            - LTR
            - MLT
            - MTR
            - HUR
          example: "94"
          description: "UN/ECE. Si no viene: 94 (unidad)."
        precio:
          type: string
          example: "2500"
          description: En pesos, con punto decimal y hasta 2 decimales. Mayor que cero.
        precioIncluyeIva:
          type: boolean
          description: true (por defecto) si el precio ya trae el IVA. Con false se le
            suma y se guarda el final.
        tipoDeIva:
          type: string
          enum: *a4
          description: gravado (19 % o 5 %), exento (0 %) o excluido (no causa IVA).
        tarifaIva:
          type: string
          enum:
            - "19"
            - "5"
          nullable: true
          description: Solo con gravado.
      required:
        - id
        - nombre
        - precio
        - tipoDeIva
    RespuestaVentaReciente:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: SETP990000123
        emitidaEn:
          type: string
          example: 2026-11-27T15:04:05.000Z
        comprador:
          type: string
          example: Consumidor final
        total:
          type: string
          example: "7500.00"
          description: Lo que pagó el comprador, con IVA.
        estado:
          type: string
          enum:
            - pendiente
            - aceptada
            - rechazada
          description: pendiente (va a la DIAN), aceptada (se puede compartir) o rechazada.
      required:
        - id
        - numero
        - emitidaEn
        - comprador
        - total
        - estado
    LineaPedida:
      type: object
      properties:
        productoId:
          type: string
          format: uuid
          description: "Producto del catálogo de la empresa: el precio y el IVA salen de
            ahí."
        cantidad:
          type: string
          example: "2"
          description: Mayor que cero, hasta 1.000.000, con punto decimal y hasta 6
            decimales.
      required:
        - productoId
        - cantidad
    NuevaVenta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Lo elige la app: repetir la petición con el mismo id no crea dos
            ventas."
        lineas:
          description: De 1 a 100 productos distintos.
          type: array
          items:
            $ref: "#/components/schemas/LineaPedida"
        compradorId:
          type: object
          format: uuid
          nullable: true
          description: "Comprador del catálogo. Si no viene: consumidor final."
        medioDePago:
          type: string
          enum:
            - efectivo
            - tarjeta-debito
            - tarjeta-credito
            - transferencia
          description: Nequi y Daviplata van como transferencia.
      required:
        - id
        - lineas
        - medioDePago
    RespuestaVenta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: SETP990000123
          description: "Número de la factura: prefijo y consecutivo de la resolución."
        emitidaEn:
          type: string
          example: 2026-11-27T15:04:05.000Z
        comprador:
          type: string
          example: Consumidor final
        total:
          type: string
          example: "7500.00"
          description: Lo que pagó el comprador, con IVA.
        iva:
          type: string
          example: "1197.48"
        estado:
          type: string
          enum:
            - pendiente
            - aceptada
            - rechazada
          description: pendiente (guardada, va a la DIAN), aceptada o rechazada.
        mensaje:
          type: string
          example: Guardada. Se está enviando a la DIAN.
        motivos:
          description: Por qué la DIAN la rechazó; vacío en los demás estados.
          type: array
          items:
            type: string
      required:
        - id
        - numero
        - emitidaEn
        - comprador
        - total
        - iva
        - estado
        - mensaje
        - motivos
