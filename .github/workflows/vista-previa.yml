# Entorno de pruebas (capas gratuitas): por cada PR hacia develop, una rama de Neon y pruebas de la API
# en Actions, vista previa de web y app en Cloudflare, y vista previa de la API en Render con la etiqueta
# render-preview. En cada push a develop: migraciones en Neon, deploy hook de Render y despliegue en Cloudflare.
# Cada trabajo se salta solo mientras falte la configuración (Docs/despliegue/entorno-de-pruebas.md)
# o mientras su carpeta no tenga proyecto.
name: Vista previa

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vista-previa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  ES_PR: ${{ github.event_name == 'pull_request' }}
  # La API de pruebas vive en Render. Con la etiqueta render-preview, el PR usa su vista previa.
  API_URL: ${{ contains(github.event.pull_request.labels.*.name, 'render-preview') && format('https://conta-api-develop-pr-{0}.onrender.com', github.event.pull_request.number) || vars.API_URL_DEVELOP }}

jobs:
  cambios:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detectar.outputs.api }}
      web: ${{ steps.detectar.outputs.web }}
      app: ${{ steps.detectar.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar la configuración de Docs/despliegue/entorno-de-pruebas.md (sección 4.3)
        env:
          V_API_URL_DEVELOP: ${{ vars.API_URL_DEVELOP }}
          V_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          V_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          S_NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Solo dice qué falta; nunca imprime valores.
          faltan=0
          for n in API_URL_DEVELOP NEON_PROJECT_ID CLOUDFLARE_ACCOUNT_ID; do
            v="V_$n"
            if [ -z "${!v}" ]; then echo "::warning::Falta la variable $n (pestaña Variables de Actions)"; faltan=1; fi
          done
          for n in NEON_API_KEY CLOUDFLARE_API_TOKEN RENDER_DEPLOY_HOOK_URL; do
            v="S_$n"
            if [ -z "${!v}" ]; then echo "::warning::Falta el secret $n (pestaña Secrets de Actions)"; faltan=1; fi
          done
          [ "$faltan" = 0 ] && echo "Configuración completa."
          exit 0
      - id: detectar
        run: |
          if [ "$ES_PR" = "true" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          cambiados="$(git diff --name-only "$base" HEAD 2>/dev/null || git ls-files)"
          for c in api web app; do
            proyecto=false
            case "$c" in
              app) [ -f app/pubspec.yaml ] && proyecto=true ;;
              web) [ -f web/consola/package.json ] && [ -f web/sitio/package.json ] && proyecto=true ;;
              *)   [ -f "$c/package.json" ] && proyecto=true ;;
            esac
            if $proyecto && echo "$cambiados" | grep -qE "^($c|contratos)/"; then
              echo "$c=true" >> "$GITHUB_OUTPUT"
            else
              echo "$c=false" >> "$GITHUB_OUTPUT"
            fi
          done

  base-de-datos:
    needs: cambios
    if: vars.NEON_PROJECT_ID != '' && needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      db_url: ${{ steps.rama.outputs.db_url }}
    steps:
      - name: Rama de Neon del PR
        if: env.ES_PR == 'true'
        id: rama-pr
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ env.PR }}
          parent_branch: develop
          role: conta_app
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Rama de Neon de develop
        if: env.ES_PR != 'true'
        id: rama-develop
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: develop
          parent_branch: main
          role: conta_app
          api_key: ${{ secrets.NEON_API_KEY }}
      - id: rama
        run: echo "db_url=${{ steps.rama-pr.outputs.db_url || steps.rama-develop.outputs.db_url }}" >> "$GITHUB_OUTPUT"

  api:
    needs: [cambios, base-de-datos]
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ needs.base-de-datos.outputs.db_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.node-version
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Tipos, compilación y pruebas unitarias
        run: |
          npm run tipos
          npm run build
          npm test
      - name: Migraciones sobre la rama de Neon
        run: npm run migrar
      - name: Pruebas de integración y e2e de NestJS contra la rama de Neon
        if: env.ES_PR == 'true'
        run: npm run test:e2e
      - name: Desplegar en Render (deploy hook)
        if: env.ES_PR != 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "Sin RENDER_DEPLOY_HOOK_URL; no se despliega."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Despliegue pedido a Render."

  web:
    needs: [cambios, api]
    if: always() && vars.CLOUDFLARE_ACCOUNT_ID != '' && needs.cambios.outputs.web == 'true' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sitio: [consola, sitio]
    defaults:
      run:
        working-directory: web/${{ matrix.sitio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/${{ matrix.sitio }}/.node-version
          cache: npm
          cache-dependency-path: web/${{ matrix.sitio }}/package-lock.json
      - run: npm ci
      - name: Tipos y pruebas
        run: |
          npm run tipos
          npm test
      - name: Construir y desplegar con OpenNext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          export NEXT_PUBLIC_API_URL="$API_URL"
          npx opennextjs-cloudflare build
          if [ "$ES_PR" = "true" ]; then
            # Una versión de vista previa exige que el Worker ya exista. La primera vez se crea con deploy.
            if ! npx wrangler versions upload --preview-alias "pr-$PR" | tee subida.log; then
              echo "El Worker aún no existe: se crea con el primer despliegue."
              npx wrangler deploy
              npx wrangler versions upload --preview-alias "pr-$PR" | tee subida.log
            fi
            url="$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' subida.log | head -1)"
            echo "URL de vista previa: ${url:-no encontrada}"
            echo "### ${{ matrix.sitio }}: ${url:-sin URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler deploy
          fi

  app:
    needs: [cambios, api]
    if: always() && vars.CLOUDFLARE_ACCOUNT_ID != '' && needs.cambios.outputs.app == 'true' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Análisis y pruebas
        run: |
          flutter analyze
          flutter test
      - name: Construir Flutter web
        run: |
          flutter build web --release --dart-define=API_URL="$API_URL"
      - name: Desplegar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: npx --yes wrangler@4.166.0
        run: |
          # El proyecto de Pages se crea solo la primera vez; develop es su rama de producción.
          if ! $WRANGLER pages project list | grep -q 'conta-app '; then
            $WRANGLER pages project create conta-app --production-branch develop
          fi
          rama="develop"
          [ "$ES_PR" = "true" ] && rama="pr-$PR"
          $WRANGLER pages deploy build/web --project-name conta-app --branch "$rama" --commit-dirty=true

  comentar:
    needs: [cambios, api, web, app]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const r = (j) => "${{ needs.api.result }},${{ needs.web.result }},${{ needs.app.result }}".split(",")[j];
            const etiquetas = (context.payload.pull_request.labels || []).map((l) => l.name);
            const filas = [
              ["API (pruebas en Actions)", "rama de Neon preview/pr-" + pr, r(0)],
              ["API en Render", etiquetas.includes("render-preview") ? `https://conta-api-develop-pr-${pr}.onrender.com` : "sin vista previa (agrega la etiqueta render-preview)", r(0)],
              ["Consola y sitio", `https://pr-${pr}-conta-consola.<subdominio>.workers.dev y pr-${pr}-conta-sitio (enlaces exactos en el resumen del workflow)`, r(1)],
              ["App web", `https://pr-${pr}.conta-app.pages.dev`, r(2)],
            ].filter((f) => f[2] === "success");
            if (!filas.length) return;
            const marca = "<!-- vista-previa -->";
            const cuerpo = `${marca}\n### Entorno de pruebas del PR\n\n| Parte | URL |\n| --- | --- |\n` +
              filas.map((f) => `| ${f[0]} | ${f[1]} |`).join("\n") +
              `\n\nLa primera llamada a Render puede tardar cerca de 1 minuto si la API estaba dormida.`;
            const { owner, repo } = context.repo;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr });
            const previo = comentarios.find((c) => c.body && c.body.startsWith(marca));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body: cuerpo });

  limpiar:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar rama de Neon del PR
        if: vars.NEON_PROJECT_ID != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ env.PR }}
          api_key: ${{ secrets.NEON_API_KEY }}
        continue-on-error: true
