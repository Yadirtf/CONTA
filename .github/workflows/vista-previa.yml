# Entorno de pruebas: una rama de Neon y un despliegue en Cloudflare por PR hacia develop,
# y el entorno estable de pruebas en cada push a develop.
# Cada trabajo se salta solo mientras falte la configuración (Docs/despliegue/entorno-de-pruebas.md)
# o mientras su carpeta no tenga proyecto.
name: Vista previa

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vista-previa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  ES_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detectar.outputs.api }}
      web: ${{ steps.detectar.outputs.web }}
      app: ${{ steps.detectar.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detectar
        run: |
          if [ "$ES_PR" = "true" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          cambiados="$(git diff --name-only "$base" HEAD 2>/dev/null || git ls-files)"
          for c in api web app; do
            proyecto=false
            case "$c" in
              app) [ -f app/pubspec.yaml ] && proyecto=true ;;
              *)   [ -f "$c/package.json" ] && proyecto=true ;;
            esac
            if $proyecto && echo "$cambiados" | grep -qE "^($c|contratos)/"; then
              echo "$c=true" >> "$GITHUB_OUTPUT"
            else
              echo "$c=false" >> "$GITHUB_OUTPUT"
            fi
          done

  base-de-datos:
    needs: cambios
    if: vars.NEON_PROJECT_ID != '' && needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      db_url: ${{ steps.rama.outputs.db_url }}
    steps:
      - name: Rama de Neon del PR
        if: env.ES_PR == 'true'
        id: rama-pr
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ env.PR }}
          parent_branch: develop
          role: conta_app
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Rama de Neon de develop
        if: env.ES_PR != 'true'
        id: rama-develop
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: develop
          parent_branch: main
          role: conta_app
          api_key: ${{ secrets.NEON_API_KEY }}
      - id: rama
        run: echo "db_url=${{ steps.rama-pr.outputs.db_url || steps.rama-develop.outputs.db_url }}" >> "$GITHUB_OUTPUT"

  api:
    needs: [cambios, base-de-datos]
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Migraciones sobre la rama de Neon
        run: npm run migrar
        env:
          DATABASE_URL: ${{ needs.base-de-datos.outputs.db_url }}
      - name: Desplegar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ needs.base-de-datos.outputs.db_url }}
          MASTER_KEY: ${{ secrets.MASTER_KEY_PRUEBAS }}
        run: |
          nombre="conta-api-develop"
          [ "$ES_PR" = "true" ] && nombre="conta-api-pr-$PR"
          npx wrangler deploy --name "$nombre"
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --name "$nombre"
          printf '%s' "$MASTER_KEY" | npx wrangler secret put MASTER_KEY --name "$nombre"

  web:
    needs: [cambios, api]
    if: always() && vars.CLOUDFLARE_ACCOUNT_ID != '' && needs.cambios.outputs.web == 'true' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sitio: [consola, sitio]
    defaults:
      run:
        working-directory: web/${{ matrix.sitio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Construir y desplegar con OpenNext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$ES_PR" = "true" ]; then
            export NEXT_PUBLIC_API_URL="https://conta-api-pr-$PR.${{ vars.CLOUDFLARE_SUBDOMINIO }}.workers.dev"
            npx opennextjs-cloudflare build
            npx wrangler versions upload --preview-alias "pr-$PR"
          else
            export NEXT_PUBLIC_API_URL="https://conta-api-develop.${{ vars.CLOUDFLARE_SUBDOMINIO }}.workers.dev"
            npx opennextjs-cloudflare build
            npx wrangler deploy
          fi

  app:
    needs: [cambios, api]
    if: always() && vars.CLOUDFLARE_ACCOUNT_ID != '' && needs.cambios.outputs.app == 'true' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Construir Flutter web
        run: |
          api="https://conta-api-develop.${{ vars.CLOUDFLARE_SUBDOMINIO }}.workers.dev"
          [ "$ES_PR" = "true" ] && api="https://conta-api-pr-$PR.${{ vars.CLOUDFLARE_SUBDOMINIO }}.workers.dev"
          flutter build web --release --dart-define=API_URL="$api"
      - name: Desplegar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rama="develop"
          [ "$ES_PR" = "true" ] && rama="pr-$PR"
          npx wrangler pages deploy build/web --project-name conta-app --branch "$rama"

  comentar:
    needs: [cambios, api, web, app]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sub = "${{ vars.CLOUDFLARE_SUBDOMINIO }}";
            const r = (j) => "${{ needs.api.result }},${{ needs.web.result }},${{ needs.app.result }}".split(",")[j];
            const filas = [
              ["API", `https://conta-api-pr-${pr}.${sub}.workers.dev`, r(0)],
              ["Consola y sitio", `alias pr-${pr} en los Workers de web`, r(1)],
              ["App web", `https://pr-${pr}.conta-app.pages.dev`, r(2)],
            ].filter((f) => f[2] === "success");
            if (!filas.length) return;
            const marca = "<!-- vista-previa -->";
            const cuerpo = `${marca}\n### Entorno de pruebas del PR\n\n| Parte | URL |\n| --- | --- |\n` +
              filas.map((f) => `| ${f[0]} | ${f[1]} |`).join("\n") +
              `\n\nBase de datos: rama \`preview/pr-${pr}\` de Neon.`;
            const { owner, repo } = context.repo;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr });
            const previo = comentarios.find((c) => c.body && c.body.startsWith(marca));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body: cuerpo });

  limpiar:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar rama de Neon del PR
        if: vars.NEON_PROJECT_ID != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ env.PR }}
          api_key: ${{ secrets.NEON_API_KEY }}
        continue-on-error: true
      - name: Borrar Worker de la API del PR
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler delete --name "conta-api-pr-$PR" --force || true
